<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>修仙传说2D·第一章：灵气觉醒</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="app">
        <div id="gameShell" class="game-shell">
            <header class="hud">
                <div class="hud-left">
                    <span id="hudName">无名 · 炼气一重</span>
                    <div class="hp-bar"><div id="hudHpFill" class="hp-fill"></div><span id="hudHpText">100/100</span></div>
                </div>
                <div class="hud-mid">
                    <span id="hudCult">🌀0</span>
                    <span id="hudStats">⚔️10 💨3.2 🎯5%</span>
                    <span id="hudFloor">🏰秘境</span>
                    <span id="hudAch">🏆0/9</span>
                </div>
                <div class="hud-right">
                    <button id="saveBtn" class="btn-icon" title="存档">💾</button>
                    <button id="menuBtn" class="btn-icon" title="菜单">☰</button>
                </div>
            </header>

            <div class="canvas-wrap">
                <canvas id="gameCanvas" width="960" height="540"></canvas>
                <div id="joyZone" class="joy-zone">
                    <div id="joyBase" class="joy-base"><div id="joyKnob" class="joy-knob"></div></div>
                </div>
                <button id="atkBtn" class="atk-btn">⚔️</button>
                <button id="interactBtn" class="interact-btn hidden">💬 交互 <small>E</small></button>
            </div>

            <footer class="action-bar">
                <button id="btnDungeon" class="action-btn primary">🏰 探索秘境</button>
                <button id="btnStory" class="action-btn">📜 剧情</button>
                <button id="btnHeal" class="action-btn">🌿 疗伤</button>
            </footer>
        </div>
    </div>

    <!-- 登录 -->
    <div id="loginOverlay" class="overlay active">
        <div class="login-box">
            <div class="login-bg"></div>
            <div class="login-title">⚔️ 修仙传说2D</div>
            <div class="login-sub">2D动作修仙 · 斩妖闯秘境</div>
            <input id="loginName" type="text" placeholder="道号（2-12字）" maxlength="12" />
            <input id="loginPass" type="password" placeholder="密码" maxlength="20" />
            <button id="loginBtn" class="btn-primary">登录 / 创建本地账号</button>
            <div id="loginHint" class="hint">账号与进度仅保存在此浏览器；密码不会上传，不支持跨设备同步</div>
            <button id="guestBtn" class="btn-secondary">👻 游客模式（本地存档）</button>
        </div>
    </div>

    <!-- 选出身 -->
    <div id="createOverlay" class="overlay">
        <div class="create-box">
            <div class="create-title">🌟 选择你的出身</div>
            <div class="origin-grid" id="originGrid"></div>
            <button id="startGameBtn" class="btn-primary" disabled>开始修仙</button>
        </div>
    </div>

    <!-- 成就 -->
    <div id="achOverlay" class="overlay">
        <div class="ach-box overlay-content">
            <div class="ach-header">
                <h2>🏆 成就系统</h2>
                <div class="ach-summary">已解锁 <span id="achUnlocked">0</span> / <span id="achTotal">0</span></div>
                <button class="btn-icon" onclick="hideOverlay('achOverlay')">✕</button>
            </div>
            <div class="ach-tabs">
                <button class="ach-tab active" data-atab="all">全部</button>
                <button class="ach-tab" data-atab="unlocked">已解锁</button>
                <button class="ach-tab" data-atab="locked">未解锁</button>
            </div>
            <div class="ach-grid" id="achGrid"></div>
        </div>
    </div>

    <!-- 图鉴 -->
    <div id="codexOverlay" class="overlay">
        <div class="codex-box overlay-content">
            <div class="codex-header">
                <h2>📖 修仙图鉴</h2>
                <button class="btn-icon" onclick="hideOverlay('codexOverlay')">✕</button>
            </div>
            <div class="codex-tabs">
                <button class="codex-tab active" data-ctab="monster">👹 妖魔志</button>
                <button class="codex-tab" data-ctab="player">🧑 修仙录</button>
                <button class="codex-tab" data-ctab="card">🃏 机缘录</button>
                <button class="codex-tab" data-ctab="item">🎒 物品志</button>
            </div>
            <div class="codex-panels">
                <div class="codex-panel" id="codex-monster"></div>
                <div class="codex-panel hidden" id="codex-player"></div>
                <div class="codex-panel hidden" id="codex-card"></div>
                <div class="codex-panel hidden" id="codex-item"></div>
            </div>
        </div>
    </div>

    <!-- 双向卡牌选择 -->
    <div id="dualCardOverlay" class="overlay">
        <div class="dual-card-box overlay-content"></div>
    </div>

    <!-- 剧情对话 -->
    <div id="storyOverlay" class="overlay">
        <div class="story-box">
            <div class="story-tag" id="storyTag">📖 第一章</div>
            <h2 class="story-title" id="storyTitle"></h2>
            <p class="story-desc" id="storyDesc"></p>
            <div class="story-options" id="storyOptions"></div>
        </div>
    </div>

    <!-- 卡牌三选一 -->
    <div id="cardsOverlay" class="overlay">
        <div class="cards-box">
            <h2 id="cardsTitle">✨ 择一机缘</h2>
            <div class="card-choices" id="cardChoices"></div>
        </div>
    </div>

    <!-- 菜单 -->
    <div id="menuOverlay" class="overlay">
        <div class="menu-box">
            <h3>⚙️ 游戏菜单</h3>
            <button class="menu-item" onclick="showSaveLoad()">💾 存档管理</button>
            <button class="menu-item" onclick="showAchievements()">🏆 成就</button>
            <button class="menu-item" onclick="showCodex()">📖 图鉴</button>
            <button class="menu-item" onclick="showTechniques()">📜 功法</button>
            <button class="menu-item" onclick="showDungeonSelector()">🏰 秘境选择</button>
            <button class="menu-item danger" onclick="confirmReset()">🔄 重新开始</button>
            <button class="menu-item" onclick="closeMenu()">关闭</button>
        </div>
    </div>

    <!-- 存档 -->
    <div id="saveLoadOverlay" class="overlay">
        <div class="save-box">
            <h3>💾 本机存档</h3>
            <p class="save-meta">存档只保存在当前浏览器。清除浏览器数据或更换设备会导致进度无法读取。</p>
            <div class="save-content" id="saveLocalContent"></div>
            <button class="btn-secondary" onclick="closeSaveLoad()">关闭</button>
        </div>
    </div>

    <!-- NPC对话 -->
    <div id="npcOverlay" class="overlay">
        <div class="npc-box overlay-content">
            <div class="npc-header">
                <canvas id="npcPortrait" width="96" height="96"></canvas>
                <div class="npc-info">
                    <span id="npcFaction" class="npc-faction"></span>
                    <h3 id="npcName"></h3>
                    <small id="npcTitle"></small>
                    <div class="npc-relation-wrap">关系：<span id="npcRelation" class="npc-relation"></span></div>
                </div>
                <button class="btn-icon" onclick="closeNpcDialog()">✕</button>
            </div>
            <p id="npcDialogue"></p>
            <div class="npc-options" id="npcOptions"></div>
        </div>
    </div>

    <!-- 秘境选择 -->
    <div id="dungeonSelectOverlay" class="overlay">
        <div class="dungeon-select-box overlay-content">
            <h2>🏰 选择秘境</h2>
            <div id="dungeonChoices"></div>
            <button class="btn-secondary" onclick="hideOverlay('dungeonSelectOverlay')">返回</button>
        </div>
    </div>

    <!-- 功法 -->
    <div id="techniquesOverlay" class="overlay">
        <div class="techniques-box overlay-content">
            <div class="techniques-header">
                <h2>📜 已悟功法</h2>
                <button class="btn-icon" onclick="hideOverlay('techniquesOverlay')">✕</button>
            </div>
            <div id="techniquesList"></div>
        </div>
    </div>

    <!-- 结算 -->
    <div id="endingOverlay" class="overlay">
        <div class="ending-box">
            <span class="ending-emoji" id="endEmoji">🏆</span>
            <h2 class="ending-title" id="endTitle"></h2>
            <p class="ending-desc" id="endDesc"></p>
            <div class="ending-stats" id="endStats"></div>
            <button class="btn-primary" onclick="hideOverlay('endingOverlay');updateHUD();">继续修行</button>
        </div>
    </div>

    <div id="toastContainer"></div>

    <!-- 模块加载顺序 -->
    <script src="js/engine/utils/MathUtils.js"></script>
    <script src="js/engine/utils/AssetLoader.js"></script>
    <script src="js/engine/utils/ObjectPool.js"></script>
    <script src="js/engine/core/EventBus.js"></script>
    <script src="js/engine/core/GameState.js"></script>
    <script src="js/engine/core/InputManager.js"></script>
    <script src="js/engine/world/MapGenerator.js"></script>
    <script src="js/engine/world/WorldSystem.js"></script>
    <script src="js/engine/world/NPCManager.js"></script>
    <script src="js/engine/systems/CombatSystem.js"></script>
    <script src="js/engine/systems/CardSystem.js"></script>
    <script src="js/engine/render/Renderer.js"></script>
    <script src="js/engine/Engine.js"></script>
    <script src="js/engine/compat.js"></script>

    <!-- 游戏数据与逻辑 -->
    <script src="js/data.js"></script>
    <script src="js/save.js"></script>
    <script src="js/story.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
